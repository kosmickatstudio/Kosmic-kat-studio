name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply narrow Kosmic Engine brain preflight patch
        shell: bash
        run: |
          python3 -c 'from pathlib import Path\np=Path("kosmicengine.js");s=p.read_text()\na="  let _dispatching=false;"\nh="""  function engineBrainPreflight(){
    const brain=(S.directorChat?.draft?.brainModel)||gs("ai_model","claude");
    const c={claude:["api_anthropic","Claude (Anthropic)"],gemini:["api_gemini","Google Gemini"],openai:["api_openai","OpenAI GPT-4o"],groq:["api_groq","Groq GPT-OSS"],deepseek:["api_deepseek","DeepSeek V4"],grok:["api_xai","Grok 4.6 (xAI)"],kimi:["api_evolink","Kimi K3 (EvoLink)"],aicredits:["api_aicredits","AICredits Gateway"]},i=c[brain];
    if(!i)return{ok:false,error:`Unsupported AI brain "${brain}". Re-select an available brain in Home.`};
    if(!String(gs(i[0],"")).trim())return{ok:false,error:`${i[1]} is selected for this production, but its API key is missing. Add the ${i[1]} API key in Settings, then tap Retry.`};
    return{ok:true};
  }

"""
if "function engineBrainPreflight()" not in s:s=s.replace(a,h+a,1)
o="""    if(!tasks||S.directorChat.awaitingApprovalTaskId||S.directorChat.awaitingPermissionIds||S.directorChat.permissionPaused)return;
    const ready=tasks.filter(t=>t.status==="pending"&&depsSatisfied(t));"""
n="""    if(!tasks||S.directorChat.awaitingApprovalTaskId||S.directorChat.awaitingPermissionIds||S.directorChat.permissionPaused)return;
    const bc=engineBrainPreflight();
    if(!bc.ok){
      const sig=bc.error;
      if(S.directorChat.brainPreflightErrorSignature!==sig){
        S.directorChat.brainPreflightErrorSignature=sig;
        push("agent","",{error:sig,retryable:true,retryTaskIds:tasks.filter(t=>t.status==="pending").map(t=>t.id)});
      }
      return;
    }
    if(S.directorChat.brainPreflightErrorSignature){S.directorChat.brainPreflightErrorSignature=null;save();}
    const ready=tasks.filter(t=>t.status==="pending"&&depsSatisfied(t));"""
if n not in s:s=s.replace(o,n,1)
p.write_text(s)
'
          git diff --check

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: kosmic-pages
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: kosmic-pages

      - name: Persist narrow source patch and remove temporary files
        shell: bash
        run: |
          git checkout -- .github/workflows/deploy.yml
          rm -f .github/workflows/fix-kosmic-engine-brain-preflight.yml .github/workflows/fix-kosmic-engine-brain-preflight-v2.yml __engine_patch_trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kosmicengine.js
          git add -u .github/workflows/fix-kosmic-engine-brain-preflight.yml .github/workflows/fix-kosmic-engine-brain-preflight-v2.yml __engine_patch_trigger.txt
          git commit -m 'fix: validate Kosmic Engine selected brain before dispatch' || true
          git push origin HEAD:main || true
