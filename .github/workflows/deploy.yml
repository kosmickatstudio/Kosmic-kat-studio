name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply narrow Kosmic Engine brain preflight patch
        shell: bash
        run: |
          python3 -c "$(printf '%s' '' | base64 -d)"
          git diff --check

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: kosmic-pages
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: kosmic-pages

      - name: Persist narrow source patch and remove temporary files
        shell: bash
        run: |
          git checkout -- .github/workflows/deploy.yml
          rm -f .github/workflows/fix-kosmic-engine-brain-preflight.yml .github/workflows/fix-kosmic-engine-brain-preflight-v2.yml __engine_patch_trigger.txt __engine_patch_trigger2.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kosmicengine.js
          git add -u .github/workflows/fix-kosmic-engine-brain-preflight.yml .github/workflows/fix-kosmic-engine-brain-preflight-v2.yml __engine_patch_trigger.txt __engine_patch_trigger2.txt
          git commit -m 'fix: validate Kosmic Engine selected brain before dispatch' || true
          git push origin HEAD:main || true
