name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Agent Feline response actions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('agentfeline.js')
          s=p.read_text(encoding='utf-8')
          marker='function afRenderAgentCard(msg){'
          if marker not in s:
              raise SystemExit('Agent Feline render marker not found')
          helper=r'''// ── AGENT FELINE RESPONSE ACTIONS ──
          // Copy, native Share (with clipboard fallback), and a persistent Like toggle.
          function afActionKey(msg){return String(msg.agentId||'agent')+'_'+String(msg.turnId||'');}
          async function afCopyResponse(key){
            const msg=(S.afChatHistory||[]).find(m=>m.role==='assistant'&&afActionKey(m)===key);
            if(!msg)return;
            const text=String(msg.content||'');
            try{
              if(navigator.clipboard&&navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
              else{
                const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
                document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
              }
              toast('✓ Response copied','');
            }catch(e){toast('Could not copy the response','error');}
          }
          async function afShareResponse(key){
            const msg=(S.afChatHistory||[]).find(m=>m.role==='assistant'&&afActionKey(m)===key);
            if(!msg)return;
            const text=String(msg.content||'');
            try{
              if(navigator.share){
                await navigator.share({title:'Agent Feline — '+String(msg.agentName||'AI'),text});
              }else{
                await afCopyResponse(key);
                toast('Share is unavailable here — response copied instead','');
              }
            }catch(e){
              if(e&&e.name!=='AbortError')toast('Could not share the response','error');
            }
          }
          function afToggleLike(key){
            const msg=(S.afChatHistory||[]).find(m=>m.role==='assistant'&&afActionKey(m)===key);
            if(!msg)return;
            msg.liked=msg.liked!==true;
            save('afChatHistory');
            renderAfChatThread();
          }
          function afResponseActions(msg){
            const key=afActionKey(msg).replace(/'/g,"\\'");
            const liked=msg.liked===true;
            return `<div style="display:flex;align-items:center;gap:4px;margin-top:9px;padding-top:7px;border-top:1px solid var(--border)">
              <button type="button" onclick="afCopyResponse('${key}')" title="Copy response" aria-label="Copy response" style="border:0;background:transparent;color:var(--textm);font-size:11px;padding:5px 7px;border-radius:7px;cursor:pointer">${pIcon('copy',12)} <span>Copy</span></button>
              <button type="button" onclick="afShareResponse('${key}')" title="Share response" aria-label="Share response" style="border:0;background:transparent;color:var(--textm);font-size:11px;padding:5px 7px;border-radius:7px;cursor:pointer">${pIcon('share',12)} <span>Share</span></button>
              <button type="button" onclick="afToggleLike('${key}')" title="${liked?'Unlike response':'Like response'}" aria-label="${liked?'Unlike response':'Like response'}" style="border:0;background:transparent;color:${liked?'var(--violet)':'var(--textm)'};font-size:11px;font-weight:${liked?'700':'500'};padding:5px 7px;border-radius:7px;cursor:pointer">${liked?'♥':'♡'} <span>${liked?'Liked':'Like'}</span></button>
            </div>`;
          }

          '''
          if '// ── AGENT FELINE RESPONSE ACTIONS ──' not in s:
              s=s.replace(marker,helper+marker,1)
          old='''  if(msg.imageError)body+=`<div style="font-size:10.5px;color:var(--gold);margin-top:6px">${pIcon('search',10)} ${afEscape(msg.imageError)}</div>`;
  return `<div class="ig-bubble-assistant" style="margin:0">${header}${body}</div>`;'''
          new='''  if(msg.imageError)body+=`<div style="font-size:10.5px;color:var(--gold);margin-top:6px">${pIcon('search',10)} ${afEscape(msg.imageError)}</div>`;
  if(!msg.error)body+=afResponseActions(msg);
  return `<div class="ig-bubble-assistant" style="margin:0">${header}${body}</div>`;'''
          if old not in s:
              raise SystemExit('Agent Feline card return block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('Agent Feline Copy / Share / Like actions patched')
          PY

      - name: Persist Agent Feline actions to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentfeline.js
          if git diff --cached --quiet; then
            echo "Agent Feline actions already present"
          else
            git commit -m "feat: add copy share and like actions to Agent Feline"
            git push
          fi

      - name: Wire current LLM catalog into Home Brain selector
        run: |
          python - <<'PY'
          from pathlib import Path
          home=Path('home.js')
          marker='const DIRECTOR_BANNERS={'
          block=r'''// ── CURRENT LLM CATALOG + LIVE UI WIRING ──
          // Verified against current provider documentation on 2026-09-08.
          // IMPORTANT: this catalog never writes API keys or clears settings.
          // API keys remain browser-local and are never stored in the repository.
          const CURRENT_LLM_CATALOG={
            claude:[
              {id:"claude-fable-5",label:"Claude Fable 5 — latest / frontier"},
              {id:"claude-opus-5",label:"Claude Opus 5 — advanced reasoning"},
              {id:"claude-sonnet-5",label:"Claude Sonnet 5 — balanced"},
              {id:"claude-haiku-4-5-20251001",label:"Claude Haiku 4.5 — fast"},
              {id:"claude-opus-4-8",label:"Claude Opus 4.8"},
              {id:"claude-opus-4-7",label:"Claude Opus 4.7"},
              {id:"claude-opus-4-6",label:"Claude Opus 4.6"},
              {id:"claude-sonnet-4-6",label:"Claude Sonnet 4.6"}
            ],
            gemini:[
              {id:"gemini-3.8-flash",label:"Gemini 3.8 Flash — FREE (latest)"},
              {id:"gemini-3.7-flash",label:"Gemini 3.7 Flash — FREE"},
              {id:"gemini-3.1-flash-lite",label:"Gemini 3.1 Flash-Lite — FREE (fast)"}
            ],
            openai:[
              {id:"gpt-5.6-sol",label:"GPT-5.6 Sol — flagship"},
              {id:"gpt-5.6-terra",label:"GPT-5.6 Terra — balanced"},
              {id:"gpt-5.6-luna",label:"GPT-5.6 Luna — cost-efficient"}
            ],
            groq:[
              {id:"openai/gpt-oss-120b",label:"GPT-OSS 120B — FREE (latest)"},
              {id:"openai/gpt-oss-20b",label:"GPT-OSS 20B — FREE (fast)"},
              {id:"qwen/qwen3.8-27b",label:"Qwen 3.8 27B — FREE"}
            ]
          };
          function applyCurrentLlmCatalog(){
            if(typeof BRAIN_SUBMODELS!=="undefined"){
              Object.keys(CURRENT_LLM_CATALOG).forEach(function(provider){
                BRAIN_SUBMODELS[provider]=CURRENT_LLM_CATALOG[provider].map(function(model){return {id:model.id,label:model.label};});
              });
            }
          }
          applyCurrentLlmCatalog();
          window.updateBrainSubModelVisibility=function(){
            applyCurrentLlmCatalog();
            var providerSel=document.getElementById("aiModelSelect");
            var wrap=document.getElementById("brainSubModelWrap");
            var sel=document.getElementById("brainSubModelSelect");
            var label=document.getElementById("brainSubModelLabel");
            if(!providerSel||!wrap||!sel)return;
            var provider=providerSel.value;
            var options=(typeof BRAIN_SUBMODELS!=="undefined"&&BRAIN_SUBMODELS[provider])||null;
            if(!options){wrap.style.display="none";sel.innerHTML="";return;}
            wrap.style.display="block";
            var providerNames={claude:"Claude",gemini:"Gemini",openai:"OpenAI",groq:"Groq",deepseek:"DeepSeek"};
            if(label)label.textContent="(which "+(providerNames[provider]||provider)+" model to actually use)";
            var key=provider+"_brain_model";
            var current=(typeof gs==="function"?gs(key,options[0].id):options[0].id);
            if(!options.some(function(o){return o.id===current;})) current=options[0].id;
            sel.innerHTML=options.map(function(o){
              return '<option value="'+String(o.id).replace(/"/g,'&quot;')+'" '+(o.id===current?'selected':'')+'>'+o.label+'</option>';
            }).join("");
            if(typeof renderSimpleTrigger==="function")renderSimpleTrigger("brainSubModelSelect");
          };
          window.refreshCurrentLlmUI=function(){
            applyCurrentLlmCatalog();
            if(document.getElementById("aiModelSelect")){
              window.updateBrainSubModelVisibility();
              if(typeof renderModelTrigger==="function")renderModelTrigger("aiModelSelect","brain");
            }
          };
          setTimeout(window.refreshCurrentLlmUI,0);
          setTimeout(window.refreshCurrentLlmUI,300);

          '''
          s=home.read_text(encoding='utf-8')
          marker_start='// ── CURRENT FREE LLM OVERRIDES ──'
          marker_start2='// ── CURRENT FREE LLM CATALOG + LIVE UI WIRING ──'
          start=s.find(marker_start)
          if start<0: start=s.find(marker_start2)
          end=s.find(marker)
          if end<0: raise SystemExit('home.js marker not found')
          if start>=0 and start<end: s=s[:start]+block+s[end:]
          else: s=s[:end]+block+s[end:]
          replacements={
            'Google Gemini (Vision-capable, cheap, supports images)':'Google Gemini — Free (3.8 Flash latest)',
            'Google Gemini — Free Tier models':'Google Gemini — Free (3.8 Flash latest)',
            'Groq GPT-OSS 120B (Free & fast, text only)':'Groq — Free (GPT-OSS 120B / Qwen 3.8 27B)',
            'Groq — Free LLMs (GPT-OSS / Qwen)':'Groq — Free (GPT-OSS 120B / Qwen 3.8 27B)'
          }
          for old,new in replacements.items(): s=s.replace(old,new)
          home.write_text(s,encoding='utf-8')
          print('LLM catalog + selector rendering patched without touching API-key storage')
          PY

      - name: Persist LLM wiring to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.js
          if git diff --cached --quiet; then
            echo "LLM wiring already present"
          else
            git commit -m "chore: update current LLM catalog and preserve API keys"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
