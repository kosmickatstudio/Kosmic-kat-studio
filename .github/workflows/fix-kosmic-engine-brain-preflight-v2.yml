name: One-time Kosmic Engine brain preflight patch v2

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-kosmic-engine-brain-preflight-v2.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Kosmic Engine through GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'kosmicengine.js';
            const file = await github.rest.repos.getContent({owner, repo, path, ref:'main'});
            const current = Buffer.from(file.data.content, 'base64').toString('utf8');
            let s = current;

            const anchor = '  let _dispatching=false;';
            if (!s.includes('// ── ENGINE BRAIN PREFLIGHT ──')) {
              const helper = `  // ── ENGINE BRAIN PREFLIGHT ──
  // Validate the brain locked into this production before the task graph can
  // make a provider call. This is intentionally Engine-local: it does not
  // change the shared auth/session architecture or any provider implementation.
  function engineBrainPreflight(){
    const brain=(S.directorChat&&S.directorChat.draft&&S.directorChat.draft.brainModel)||gs("ai_model","claude");
    const catalog={
      claude:{key:"api_anthropic",label:"Claude (Anthropic)"},
      gemini:{key:"api_gemini",label:"Google Gemini"},
      openai:{key:"api_openai",label:"OpenAI GPT-4o"},
      groq:{key:"api_groq",label:"Groq GPT-OSS"},
      deepseek:{key:"api_deepseek",label:"DeepSeek V4"},
      grok:{key:"api_xai",label:"Grok 4.6 (xAI)"},
      kimi:{key:"api_evolink",label:"Kimi K3 (EvoLink)"},
      aicredits:{key:"api_aicredits",label:"AICredits Gateway"}
    };
    const info=catalog[brain];
    if(!info){
      return {ok:false,brain,key:"unknown",error:\`Kosmic Engine has an unsupported AI brain selection ("\${brain}"). Re-select one of the available AI brains in Home before starting this production.\`};
    }
    const value=gs(info.key,"");
    if(typeof value!=="string"||!value.trim()){
      return {ok:false,brain,key:info.key,error:\`\${info.label} is selected for this production, but its API key is missing. Add the \${info.label} API key in Settings, then tap Retry.\`};
    }
    return {ok:true,brain,key:info.key,label:info.label};
  }

`;
              if (!s.includes(anchor)) core.setFailed('PATCH_ANCHOR_MISSING: dispatch lock anchor not found');
              else s = s.replace(anchor, helper + anchor, 1);
            }

            const old = `    if(!tasks||S.directorChat.awaitingApprovalTaskId||S.directorChat.awaitingPermissionIds||S.directorChat.permissionPaused)return;
    const ready=tasks.filter(t=>t.status===\"pending\"&&depsSatisfied(t));`;
            const newer = `    if(!tasks||S.directorChat.awaitingApprovalTaskId||S.directorChat.awaitingPermissionIds||S.directorChat.permissionPaused)return;

    // Never let the first planning task fall through to a stale provider-key
    // allowlist. The production's brain was locked when the brief was created;
    // validate that exact brain here, including the newer Grok/Kimi providers.
    const brainCheck=engineBrainPreflight();
    if(!brainCheck.ok){
      const signature=brainCheck.brain+\"|\"+brainCheck.key+\"|\"+brainCheck.error;
      if(S.directorChat.brainPreflightErrorSignature!==signature){
        S.directorChat.brainPreflightErrorSignature=signature;
        push(\"agent\",\"\",{error:brainCheck.error,retryable:true,retryTaskIds:tasks.filter(t=>t.status===\"pending\").map(t=>t.id)});
      }
      return;
    }
    if(S.directorChat.brainPreflightErrorSignature){
      S.directorChat.brainPreflightErrorSignature=null;
      save();
    }

    const ready=tasks.filter(t=>t.status===\"pending\"&&depsSatisfied(t));`;
            if (!s.includes(newer)) {
              if (!s.includes(old)) core.setFailed('PATCH_ANCHOR_MISSING: dispatch task guard not found');
              else s = s.replace(old, newer, 1);
            }

            if (s === current) {
              core.info('Kosmic Engine brain preflight already present or no change required.');
            } else {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path,
                message:'fix: validate Kosmic Engine selected brain before dispatch',
                content:Buffer.from(s,'utf8').toString('base64'),
                sha:file.data.sha,
                branch:'main'
              });
              core.info('Kosmic Engine brain preflight patch committed.');
            }

      - name: Refresh checkout to patched main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload patched Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: kosmic-pages-brain-preflight-v2
          path: "."

      - name: Deploy patched source
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: kosmic-pages-brain-preflight-v2

      - name: Remove both one-time patch workflows
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            for (const path of [
              '.github/workflows/fix-kosmic-engine-brain-preflight.yml',
              '.github/workflows/fix-kosmic-engine-brain-preflight-v2.yml'
            ]) {
              try {
                const file = await github.rest.repos.getContent({owner, repo, path, ref:'main'});
                await github.rest.repos.deleteFile({
                  owner, repo, path,
                  message:'chore: remove one-time engine patch workflows',
                  sha:file.data.sha,
                  branch:'main'
                });
                core.info(`Removed ${path}`);
              } catch (err) {
                if (err.status === 404) core.info(`${path} already absent`);
                else throw err;
              }
            }
