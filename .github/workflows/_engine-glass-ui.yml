name: Engine Glass UI Patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/_engine-glass-ui.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Kosmic Engine input UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('kosmicengine.js')
          s=p.read_text()
          if 'KOSMIC ENGINE GLASS INPUT V1' in s:
              print('Glass UI already applied')
              raise SystemExit(0)

          css = r'''<style id="dcGlassStyles">
          #dcInputBar.kosmic-engine-glass-input{
            position:relative!important;
            background:linear-gradient(135deg,rgba(255,255,255,.76),rgba(246,242,255,.58))!important;
            -webkit-backdrop-filter:blur(28px) saturate(150%);
            backdrop-filter:blur(28px) saturate(150%);
            border:1px solid rgba(255,255,255,.78)!important;
            border-top:1px solid rgba(255,255,255,.9)!important;
            border-radius:28px!important;
            margin:10px!important;
            padding:12px!important;
            box-shadow:0 18px 50px rgba(86,61,140,.13),inset 0 1px 0 rgba(255,255,255,.85)!important;
            overflow:visible!important;
          }
          #dcInputBar.kosmic-engine-glass-input:before{
            content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;
            background:radial-gradient(circle at 12% 0%,rgba(170,145,255,.14),transparent 34%),radial-gradient(circle at 92% 100%,rgba(118,207,255,.12),transparent 35%);
          }
          #dcInputBar .dc-glass-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1;margin-bottom:8px}
          #dcInputBar .dc-glass-hint{font-size:10px;font-weight:800;color:var(--textm);letter-spacing:.02em}
          #dcInputBar .dc-settings-btn{
            width:34px;height:34px;border-radius:12px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.58);
            color:var(--violet);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;
            box-shadow:0 5px 18px rgba(75,50,130,.10);transition:transform .18s ease,background .18s ease
          }
          #dcInputBar .dc-settings-btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.82)}
          #dcEngineSettings{
            position:relative;z-index:2;display:none;margin:0 0 9px;padding:10px;border-radius:20px;
            background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.75)
          }
          #dcEngineSettings.is-open{display:block;animation:dcGlassDrop .18s ease-out}
          @keyframes dcGlassDrop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
          #dcInputBar #dcEngineModes{margin-bottom:8px!important}
          #dcInputBar #dcEngineModes button{min-height:42px!important;border-radius:15px!important;background:rgba(255,255,255,.55)!important;border-color:rgba(255,255,255,.8)!important;box-shadow:0 4px 16px rgba(75,50,130,.06)!important;transition:all .18s ease}
          #dcInputBar #dcEngineModes button:hover{transform:translateY(-1px);background:rgba(255,255,255,.82)!important}
          #dcInputBar #dcEngineModelRow{margin-bottom:0!important;padding:2px 0}
          #dcInputBar #dcEngineModel{background:rgba(255,255,255,.72)!important;border-color:rgba(255,255,255,.85)!important;border-radius:13px!important;min-height:38px}
          #dcInputBar .dc-glass-composer{position:relative;z-index:1;display:flex;align-items:flex-end;gap:8px;padding:7px;border-radius:21px;background:rgba(255,255,255,.52);border:1px solid rgba(255,255,255,.78);box-shadow:inset 0 1px 0 rgba(255,255,255,.72)}
          #dcInputBar .dc-attach-btn{width:38px;height:38px;border-radius:13px;border:1px solid rgba(255,255,255,.82);background:rgba(255,255,255,.68);color:var(--violet);font-size:19px;line-height:1;cursor:pointer;flex-shrink:0;box-shadow:0 4px 14px rgba(75,50,130,.07)}
          #dcInputBar #dcInput{flex:1;min-height:40px;max-height:180px;resize:none;background:transparent!important;border:0!important;outline:none!important;box-shadow:none!important;border-radius:15px!important;padding:9px 7px!important;color:var(--text);font-size:13px;line-height:1.45}
          #dcInputBar #dcInput::placeholder{color:var(--textm);opacity:.72}
          #dcInputBar .ig-send-btn{width:42px!important;height:42px!important;border-radius:15px!important;box-shadow:0 8px 22px rgba(104,73,220,.22)!important;flex-shrink:0}
          #dcInputBar #dcRefStrip{position:relative;z-index:1;padding:4px 2px}
          @media(max-width:700px){
            #dcInputBar.kosmic-engine-glass-input{margin:7px!important;padding:9px!important;border-radius:23px!important}
            #dcInputBar.kosmic-engine-glass-input:before{border-radius:23px}
            #dcInputBar .dc-glass-hint{font-size:9px}
            #dcInputBar #dcEngineModes{gap:5px!important}
            #dcInputBar #dcEngineModes button{min-width:118px!important;flex:0 0 auto!important}
            #dcInputBar .dc-glass-composer{gap:6px;padding:6px;border-radius:18px}
            #dcInputBar #dcInput{font-size:12px;min-height:38px}
            #dcInputBar .dc-attach-btn{width:36px;height:36px}
            #dcInputBar .ig-send-btn{width:39px!important;height:39px!important;border-radius:13px!important}
            #dcEngineSettings{padding:8px;border-radius:17px}
          }
          @media(prefers-reduced-motion:reduce){#dcInputBar *{transition:none!important;animation:none!important}}
          </style>'''

          start=s.index('      <div id="dcInputBar"')
          end=s.index('\n    </div>\n  `;', start)
          new = '''      <div id="dcInputBar" class="kosmic-engine-glass-input">
        <div class="dc-glass-top">
          <span class="dc-glass-hint">Kosmic Engine · ready to create</span>
          <button type="button" class="dc-settings-btn" title="Engine settings" aria-label="Engine settings" aria-expanded="false" onclick="const p=document.getElementById('dcEngineSettings');const o=p.classList.toggle('is-open');this.setAttribute('aria-expanded',o);this.textContent=o?'×':'⚙'">⚙</button>
        </div>
        <div id="dcEngineSettings">
          <div style="font-size:10px;font-weight:900;color:var(--text);margin-bottom:7px">ENGINE SETTINGS</div>
          <div id="dcEngineModes" style="display:flex;gap:6px;margin-bottom:7px;overflow-x:auto;scrollbar-width:none">
            <button type="button" data-engine-tier="lite" onclick="KosmicEngine.setEngineTier('lite')" style="flex:1;min-width:0;border:1.5px solid var(--border);border-radius:11px;padding:7px 8px;background:var(--surface);color:var(--text);font-size:10px;font-weight:800;cursor:pointer">⚡ Engine Lite</button>
            <button type="button" data-engine-tier="advance" onclick="KosmicEngine.setEngineTier('advance')" style="flex:1;min-width:0;border:1.5px solid var(--border);border-radius:11px;padding:7px 8px;background:var(--surface);color:var(--text);font-size:10px;font-weight:800;cursor:pointer">◆ Engine Advance</button>
            <button type="button" data-engine-tier="ultra" onclick="KosmicEngine.setEngineTier('ultra')" style="flex:1;min-width:0;border:1.5px solid var(--border);border-radius:11px;padding:7px 8px;background:var(--surface);color:var(--text);font-size:10px;font-weight:800;cursor:pointer">✦ Engine Ultra</button>
          </div>
          <div id="dcEngineModelRow" style="display:flex;align-items:center;gap:7px">
            <span style="font-size:9px;font-weight:800;color:var(--textm);white-space:nowrap">AI BRAIN</span>
            <select id="dcEngineModel" onchange="KosmicEngine.setEngineModel(this.value)" style="flex:1;min-width:0;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);padding:7px 9px;font-size:10px;font-weight:700"></select>
            <span id="dcEngineLock" style="display:none;font-size:9px;color:var(--green);font-weight:800;white-space:nowrap">LOCKED</span>
          </div>
        </div>
        <div id="dcRefStrip" style="display:none;gap:7px;flex-wrap:wrap;margin-bottom:8px"></div>
        <div class="dc-glass-composer">
          <input type="file" accept="image/*" multiple id="dcRefFile" style="display:none" onchange="KosmicEngine.handleRefUpload(event)">
          <button class="dc-attach-btn" onclick="document.getElementById('dcRefFile').click()" title="Add reference images" aria-label="Add reference images">+</button>
          <textarea class="ig-input-textarea-v2" id="dcInput" placeholder="Describe what you want to create…" rows="1" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,180)+'px'" onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();KosmicEngine.send();}"></textarea>
          <button class="ig-send-btn" onclick="KosmicEngine.send()" title="Create" aria-label="Create">➤</button>
        </div>
      </div>'''
          s=s[:start]+css+'\n'+new+s[end:]
          p.write_text(s)
          print('patched', len(s))
          PY
          node --check kosmicengine.js
      - name: Commit and remove temporary workflow
        run: |
          git config user.name kosmickatstudio
          git config user.email kosmic735@gmail.com
          git add kosmicengine.js
          git commit -m "feat: redesign Kosmic Engine input with responsive glass UI" || true
          git rm .github/workflows/_engine-glass-ui.yml
          git commit -m "chore: remove temporary Engine glass UI patch workflow"
          git push
