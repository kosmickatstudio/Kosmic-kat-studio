name: Patch Engine mobile review loader
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('motion.js'); s=p.read_text(); marker='// KOSMIC ENGINE MOBILE REVIEW UX'
          if marker not in s:
              s += '\n'+marker+'\n(function(){const x=document.createElement("script");x.src="engine-mobile-review.js";x.async=false;x.dataset.kosmicEngineMobileReview="1";document.head.appendChild(x)})();\n'; p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion.js
          git diff --cached --quiet || git commit -m "Load Kosmic Engine mobile review UX"
          git push
# one-time loader patch
