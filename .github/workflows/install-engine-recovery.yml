name: Install Kosmic Engine recovery
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install recovery loader and bump cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('motion.js')
          s=p.read_text()
          marker='data-kosmic-engine-recovery="1"'
          if marker not in s:
              s += '\n\n// KOSMIC ENGINE PRODUCTION RECOVERY\n(function(){const x=document.createElement("script");x.src="engine-recovery.js";x.async=false;x.dataset.kosmicEngineRecovery="1";document.head.appendChild(x)})();\n'
              p.write_text(s)
          p=Path('sw.js')
          s=p.read_text()
          s=s.replace('kosmic-kat-studio-v26','kosmic-kat-studio-v27',1)
          if '"/engine-recovery.js"' not in s:
              s=s.replace('"/engine-strategy-ui.js",','"/engine-strategy-ui.js","/engine-recovery.js",',1)
          p.write_text(s)
          PY
          node --check motion.js
          node --check engine-recovery.js
          node --check kosmicengine.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add motion.js sw.js
          git diff --cached --quiet || git commit -m '[recovery] install production recovery loader'
          git push
