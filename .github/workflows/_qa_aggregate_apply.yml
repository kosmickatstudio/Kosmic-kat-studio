name: Apply Kosmic Engine QA aggregation

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch QA aggregation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kosmicengine.js')
          s=p.read_text(encoding='utf-8')

          if 'async function runQABatchDetailed' not in s:
              marker='''  async function runQACheck(imageUrl,description){\n    const r=await runQACheckDetailed(imageUrl,description);\n    return r.note;\n  }\n'''
              if marker not in s:
                  raise SystemExit('QA helper marker missing')
              helper='''  async function runQABatchDetailed(items){\n    const list=(items||[]).filter(x=>x&&x.url);\n    if(!list.length)return{ran:false,passed:false,note:null,checks:[],reason:"no assets to check"};\n    const checks=await Promise.all(list.map(async item=>{\n      const r=await runQACheckDetailed(item.url,item.description||item.label||"production asset");\n      return{label:item.label||"asset",...r};\n    }));\n    const ran=checks.length===list.length&&checks.every(x=>x.ran);\n    const passed=ran&&checks.every(x=>x.passed);\n    const flagged=checks.filter(x=>x.note).map(x=>`${x.label}: ${x.note}`);\n    return{ran,passed,note:flagged.length?flagged.join(" | "):null,checks,reason:ran?null:"one or more quality checks did not run"};\n  }\n'''
              s=s.replace(marker,marker+helper,1)

          replacements=[
            ('''      const sheets=p.characterSheets||[];\n      const mc=sheets.find(s=>s.tier==="MC"||s.tier==="LEAD");\n      const qa=mc?await runQACheckDetailed(mc.sheetUrl,mc.desc):{ran:false,passed:false,note:null,reason:"no sheet to check"};\n      task.qa=qa; const qaNote=qa.note;''',
             '''      const sheets=p.characterSheets||[];\n      const qa=await runQABatchDetailed(sheets.map(s=>({label:s.tier==="SIDE"?"Side characters":s.name,url:s.sheetUrl,description:s.desc})));\n      task.qa=qa; const qaNote=qa.note||(!qa.ran?`QA incomplete: ${qa.reason}`:null);'''),
            ('''      const firstLoc=p.locationBible[0];\n      const qa=firstLoc?await runQACheckDetailed(firstLoc.url,firstLoc.desc):{ran:false,passed:false,note:null,reason:"no location image to check"};\n      task.qa=qa; const qaNote=qa.note;''',
             '''      const qa=await runQABatchDetailed((p.locationBible||[]).map(l=>({label:l.name,url:l.url,description:l.desc})));\n      task.qa=qa; const qaNote=qa.note||(!qa.ran?`QA incomplete: ${qa.reason}`:null);'''),
            ('''      const qa=e.storyboard[0]?await runQACheckDetailed(e.storyboard[0].url,e.masterPrompt):{ran:false,passed:false,note:null,reason:"no storyboard frame to check"};\n      task.qa=qa; const qaNote=qa.note;''',
             '''      const qa=await runQABatchDetailed((e.storyboard||[]).map((shot,i)=>({label:`Shot ${i+1}`,url:shot.url,description:shot.prompt||e.masterPrompt})));\n      task.qa=qa; const qaNote=qa.note||(!qa.ran?`QA incomplete: ${qa.reason}`:null);''')
          ]
          for old,new in replacements:
              if old in s:
                  s=s.replace(old,new,1)
              elif new not in s:
                  raise SystemExit('expected QA review block missing')

          p.write_text(s,encoding='utf-8')
          print('QA aggregation patch applied')
          PY
      - name: Syntax check
        shell: bash
        run: node --check kosmicengine.js
      - name: Remove temporary patch files and commit
        shell: bash
        run: |
          rm -f .github/workflows/_qa_aggregate_apply.yml
          git config user.name "kosmickatstudio"
          git config user.email "kosmic735@gmail.com"
          git add -A kosmicengine.js .github/workflows scripts
          git commit -m "feat: aggregate Kosmic Engine visual QA across assets"
          git push
