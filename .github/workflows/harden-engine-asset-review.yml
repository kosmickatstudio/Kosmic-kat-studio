name: Harden Engine asset review
on:
  push:
    branches: ["main"]
permissions:
  contents: write
  actions: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[asset-review-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch narrowly
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('engine-asset-review.js')
          s=p.read_text()
          old='''if(t.type==="charsheet_review"||t.type==="loc_review"){const target=t.type==="charsheet_review"?(S.directorChat.tasks||[]).find(x=>x.type==="charsheet_single"&&x.charIndex===i)||(S.directorChat.tasks||[]).find(x=>x.type==="charsheet_side"&&i===0):(S.directorChat.tasks||[]).find(x=>x.type==="loc_img"&&x.locIndex===i);if(!target)return;target.status="pending";target.error=null;target.permitted=true;target.assetFeedback=reason;t.status="pending";S.directorChat.awaitingApprovalTaskId=null;save();return KosmicEngine.dispatch();}'''
          new='''if(t.type==="charsheet_review"||t.type==="loc_review"){const target=t.type==="charsheet_review"?(a.tier==="SIDE"?(S.directorChat.tasks||[]).find(x=>x.type==="charsheet_side"):(S.directorChat.tasks||[]).find(x=>x.type==="charsheet_single"&&x.charIndex===(S.productions.find(y=>y.id===p.id)?.characters||[]).filter(c=>c.tier==="MC"||c.tier==="LEAD").findIndex(c=>c.name===a.label))):(S.directorChat.tasks||[]).find(x=>x.type==="loc_img"&&x.locIndex===i);if(!target)return;target.status="pending";target.error=null;target.permitted=true;target.assetFeedback=reason;target.assetReviewIndex=i;t.status="pending";S.directorChat.awaitingApprovalTaskId=null;save();return KosmicEngine.dispatch();}'''
          if old not in s: raise SystemExit('asset-review target block not found')
          p.write_text(s.replace(old,new))

          p=Path('kosmicengine.js')
          s=p.read_text()
          old='''p.characterSheets.push({tier:c.tier,name:c.name,desc:c.desc,sheetUrl:result.url,model:p.imageModel||null});'''
          new='''const replacementIndex=Number.isInteger(task.assetReviewIndex)?task.assetReviewIndex:-1;const sheetRecord={tier:c.tier,name:c.name,desc:c.desc,sheetUrl:result.url,model:p.imageModel||null};if(replacementIndex>=0&&replacementIndex<(p.characterSheets||[]).length)p.characterSheets[replacementIndex]=sheetRecord;else p.characterSheets.push(sheetRecord);delete task.assetReviewIndex;'''
          if old not in s: raise SystemExit('character sheet push block not found')
          p.write_text(s.replace(old,new))
          PY
          node --check kosmicengine.js
          node --check engine-asset-review.js
          git diff --check
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'kosmic-kat-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kosmicengine.js engine-asset-review.js
          git commit -m 'fix: harden Engine per-asset regeneration [asset-review-hardening]'
          git push
          gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
