name: Harden Engine generation attempts
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generation attempt guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('kosmicengine.js')
          s=p.read_text()
          def need(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(label)
              s=s.replace(old,new,1)
          need('''      parallelReady.forEach(t=>t.status="running");
      save();
      await Promise.allSettled(parallelReady.map(async t=>{
        try{
          const out=await runTaskWork(t);
          t.status="done";''','''      parallelReady.forEach(t=>{
        t.status="running";
        t.runToken=`${Date.now()}-${Math.random().toString(36).slice(2)}`;
        t.runStartedAt=Date.now();
      });
      save();
      await Promise.allSettled(parallelReady.map(async t=>{
        const __runToken=t.runToken;
        try{
          const out=await runTaskWork(t);
          if(t.runToken!==__runToken)throw new Error("Stale Engine task attempt ignored");
          t.status="done";''','parallel')
          need('''      t.status="running";
      save();
      if(!t.requiresApproval&&t.type!=="plan")push("agent",`⏳ ${t.label}…`,{taskId:t.id});''','''      t.status="running";
      t.runToken=`${Date.now()}-${Math.random().toString(36).slice(2)}`;
      t.runStartedAt=Date.now();
      save();
      if(!t.requiresApproval&&t.type!=="plan")push("agent",`⏳ ${t.label}…`,{taskId:t.id});''','serial-start')
          need('''      try{
        const out=await runTaskWork(t);
        if(t.requiresApproval){''','''      try{
        const __runToken=t.runToken;
        const out=await runTaskWork(t);
        if(t.runToken!==__runToken)throw new Error("Stale Engine task attempt ignored");
        if(t.requiresApproval){''','serial-complete')
          need('''  async function runTaskWork(task){
    return withEngineAiOverride(()=>_runTaskWork(task));
  }
  async function _runTaskWork(task){
    const prodId=S.directorChat.productionId;''','''  function assertTaskAttempt(task,attemptId){
    if(!task||task.runToken!==attemptId)throw new Error("Stale Engine task attempt ignored");
  }
  async function runTaskWork(task){
    const attemptId=task.runToken;
    assertTaskAttempt(task,attemptId);
    return withEngineAiOverride(()=>_runTaskWork(task,attemptId));
  }
  async function _runTaskWork(task,attemptId){
    assertTaskAttempt(task,attemptId);
    const prodId=S.directorChat.productionId;''','runner')
          start=s.index('  async function _runTaskWork(task,attemptId){')
          end=s.index('\n  function ',start+40)
          block=s[start:end]
          lines=block.splitlines();out=[]
          for line in lines:
              out.append(line)
              st=line.lstrip()
              if 'await ' in line and not st.startswith('//') and not st.startswith('*'):
                  out.append(line[:len(line)-len(st)]+'assertTaskAttempt(task,attemptId);')
          s=s[:start]+'\n'.join(out)+s[end:]
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check kosmicengine.js
          node --check engine-recovery.js
          git diff --check
          grep -q 'runToken' kosmicengine.js
          grep -q 'assertTaskAttempt' kosmicengine.js
      - name: Commit patch
        run: |
          git config user.name "kosmickatstudio"
          git config user.email "kosmickatstudio@users.noreply.github.com"
          git add kosmicengine.js
          git diff --cached --quiet && exit 0
          git commit -m "[reliability] guard stale Engine generation attempts"
          git push
