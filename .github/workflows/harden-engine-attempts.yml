name: Harden Engine generation attempts
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generation attempt guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('kosmicengine.js')
          s=p.read_text()
          old1="      parallelReady.forEach(t=>t.status=\"running\");\n      save();\n      await Promise.allSettled(parallelReady.map(async t=>{\n        try{\n          const out=await runTaskWork(t);\n          t.status=\"done\";"
          new1="      parallelReady.forEach(t=>{\n        t.status=\"running\";\n        t.runToken=`${Date.now()}-${Math.random().toString(36).slice(2)}`;\n        t.runStartedAt=Date.now();\n      });\n      save();\n      await Promise.allSettled(parallelReady.map(async t=>{\n        const __runToken=t.runToken;\n        try{\n          const out=await runTaskWork(t);\n          if(t.runToken!==__runToken)return;\n          t.status=\"done\";"
          if old1 not in s: raise SystemExit('parallel dispatcher pattern not found')
          s=s.replace(old1,new1,1)
          pattern=re.compile(r'(      t\.status=\"running\";\n)(      save\(\);\n)(      try\{\n        const out=await runTaskWork\(t\);)')
          replacement=r'\1      t.runToken=`${Date.now()}-${Math.random().toString(36).slice(2)}`;\n      t.runStartedAt=Date.now();\n\2      const __runToken=t.runToken;\n\3\n        if(t.runToken!==__runToken)return;'
          s,n=pattern.subn(replacement,s,count=1)
          if n!=1: raise SystemExit('serial dispatcher pattern not found')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check kosmicengine.js
          node --check engine-recovery.js
          git diff --check
          grep -q 't.runToken' kosmicengine.js
          grep -q '__runToken' kosmicengine.js
      - name: Commit patch
        run: |
          git config user.name "kosmickatstudio"
          git config user.email "kosmickatstudio@users.noreply.github.com"
          git add kosmicengine.js
          git diff --cached --quiet && exit 0
          git commit -m "[reliability] guard stale Engine generation attempts"
          git push
