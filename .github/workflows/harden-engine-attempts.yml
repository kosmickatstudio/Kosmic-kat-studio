name: Harden Engine generation attempts
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generation attempt guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('kosmicengine.js')
          s=p.read_text()

          # Dispatcher: every execution gets a persisted token. A late result from
          # an older attempt can therefore never finalize a newer retry.
          old='''      parallelReady.forEach(t=>t.status="running");
      save();
      await Promise.allSettled(parallelReady.map(async t=>{
        try{
          const out=await runTaskWork(t);
          t.status="done";'''
          new='''      parallelReady.forEach(t=>{
        t.status="running";
        t.runToken=`${Date.now()}-${Math.random().toString(36).slice(2)}`;
        t.runStartedAt=Date.now();
      });
      save();
      await Promise.allSettled(parallelReady.map(async t=>{
        const __runToken=t.runToken;
        try{
          const out=await runTaskWork(t);
          if(t.runToken!==__runToken)throw new Error("Stale Engine task attempt ignored");
          t.status="done";'''
          if old not in s:
              raise SystemExit('parallel dispatcher anchor not found')
          s=s.replace(old,new,1)

          old='''      t.status="running";
      save();
      if(!t.requiresApproval&&t.type!=="plan")push("agent",`⏳ ${t.label}…`,{taskId:t.id});'''
          new='''      t.status="running";
      t.runToken=`${Date.now()}-${Math.random().toString(36).slice(2)}`;
      t.runStartedAt=Date.now();
      save();
      if(!t.requiresApproval&&t.type!=="plan")push("agent",`⏳ ${t.label}…`,{taskId:t.id});'''
          if old not in s:
              raise SystemExit('sequential start anchor not found')
          s=s.replace(old,new,1)

          old='''      try{
        const out=await runTaskWork(t);
        if(t.requiresApproval){'''
          new='''      try{
        const __runToken=t.runToken;
        const out=await runTaskWork(t);
        if(t.runToken!==__runToken)throw new Error("Stale Engine task attempt ignored");
        if(t.requiresApproval){'''
          if old not in s:
              raise SystemExit('sequential completion anchor not found')
          s=s.replace(old,new,1)

          # Engine work has several provider awaits followed by writes into the
          # production object. Abort the continuation if a newer retry replaced
          # this attempt while the provider request was in flight.
          old='''  async function runTaskWork(task){
    return withEngineAiOverride(()=>_runTaskWork(task));
  }
  async function _runTaskWork(task){'''
          new='''  function assertTaskAttempt(task,attemptId){
    if(!task||task.runToken!==attemptId)throw new Error("Stale Engine task attempt ignored");
  }
  async function runTaskWork(task){
    const attemptId=task.runToken;
    assertTaskAttempt(task,attemptId);
    return withEngineAiOverride(()=>_runTaskWork(task,attemptId));
  }
  async function _runTaskWork(task,attemptId){
    assertTaskAttempt(task,attemptId);'''
          if old not in s:
              raise SystemExit('runTaskWork anchor not found')
          s=s.replace(old,new,1)

          start=s.index('  async function _runTaskWork(task,attemptId){')
          end=s.index('\n  function ',start+len('  async function _runTaskWork(task,attemptId){'))
          block=s[start:end]
          lines=block.splitlines()
          out=[]
          for line in lines:
              out.append(line)
              stripped=line.lstrip()
              if 'await ' in line and not stripped.startswith('//') and not stripped.startswith('*'):
                  indent=line[:len(line)-len(stripped)]
                  out.append(indent+'assertTaskAttempt(task,attemptId);')
          s=s[:start]+'\n'.join(out)+s[end:]
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check kosmicengine.js
          node --check engine-recovery.js
          git diff --check
          grep -q 'runToken' kosmicengine.js
          grep -q 'assertTaskAttempt' kosmicengine.js
      - name: Commit patch
        run: |
          git config user.name "kosmickatstudio"
          git config user.email "kosmickatstudio@users.noreply.github.com"
          git add kosmicengine.js
          git diff --cached --quiet && exit 0
          git commit -m "[reliability] guard stale Engine generation attempts"
          git push
