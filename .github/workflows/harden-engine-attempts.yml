name: Harden Engine generation attempts
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generation attempt guards
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='kosmicengine.js';
          let s=fs.readFileSync(p,'utf8');
          const old1='''      parallelReady.forEach(t=>t.status="running");\n      save();\n      await Promise.allSettled(parallelReady.map(async t=>{\n        try{\n          const out=await runTaskWork(t);\n          t.status="done";''';
          const new1='''      parallelReady.forEach(t=>{\n        t.status="running";\n        t.runToken=`${Date.now()}-${Math.random().toString(36).slice(2)}`;\n        t.runStartedAt=Date.now();\n      });\n      save();\n      await Promise.allSettled(parallelReady.map(async t=>{\n        const __runToken=t.runToken;\n        try{\n          const out=await runTaskWork(t);\n          if(t.runToken!==__runToken)return;\n          t.status="done";''';
          const old2='''      t.status="running";\n      save();\n      try{\n        const out=await runTaskWork(t);\n        if(t.requiresApproval){''';
          const new2='''      t.status="running";\n      t.runToken=`${Date.now()}-${Math.random().toString(36).slice(2)}`;\n      t.runStartedAt=Date.now();\n      save();\n      const __runToken=t.runToken;\n      try{\n        const out=await runTaskWork(t);\n        if(t.runToken!==__runToken)return;\n        if(t.requiresApproval){''';
          if(!s.includes(old1))throw new Error('parallel dispatcher pattern not found');
          if(!s.includes(old2))throw new Error('serial dispatcher pattern not found');
          s=s.replace(old1,new1).replace(old2,new2);
          fs.writeFileSync(p,s);
          NODE
      - name: Validate
        run: |
          node --check kosmicengine.js
          node --check engine-recovery.js
          git diff --check
          grep -q 't.runToken' kosmicengine.js
          grep -q '__runToken' kosmicengine.js
      - name: Commit patch
        run: |
          git config user.name "kosmickatstudio"
          git config user.email "kosmic7353800@users.noreply.github.com"
          git add kosmicengine.js
          git diff --cached --quiet && exit 0
          git commit -m "[reliability] guard stale Engine generation attempts"
          git push
