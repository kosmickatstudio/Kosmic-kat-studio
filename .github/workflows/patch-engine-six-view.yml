name: Patch Engine six-view character sheets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-engine-six-view.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch character sheet prompt
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kosmicengine.js')
          s=p.read_text()
          old='''      const prompt=`${c.desc}, full character reference turnaround sheet, single composite image arranged in an organized grid showing: front full-body view, back full-body view, 3/4 angle full-body view, close-up face portrait (front angle), and close-up face portrait (side profile angle) — clearly show any special or distinguishing features (scars, markings, accessories, unique traits) in the close-up views, consistent character design across all views, environmental background reflecting the story's actual setting rather than a plain studio backdrop, professional character design sheet, only this one character, no other people${csFix}${styleSuffix(p)}${rulesSuffix(p)}`;'''
          new='''      const prompt=`${c.desc}, full character reference turnaround sheet, single composite image arranged in a clean organized 2x3 grid showing EXACTLY SIX views of the SAME character: (1) front full-body view, (2) back full-body view, (3) 3/4 angle full-body view, (4) neutral full-body side/profile view, (5) close-up face portrait front angle, and (6) close-up face portrait side profile angle — all six views must depict the identical person/creature with identical face, body proportions, hair, clothing, colors, scars, markings, accessories and unique traits; clearly show special distinguishing features in the close-ups; environmental background reflecting the story's actual setting rather than a plain studio backdrop; professional character design sheet, only this one character, no other people, no duplicate views, no missing panel${csFix}${styleSuffix(p)}${rulesSuffix(p)}`;'''
          if old not in s:
              raise SystemExit('Expected character-sheet prompt not found; refusing to modify')
          s=s.replace(old,new,1)
          s=s.replace('// One composite image containing front/back/3-4/face views, using ONLY','// One composite image containing SIX explicit consistency views, using ONLY',1)
          p.write_text(s)
          PY
          node --check kosmicengine.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kosmicengine.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Engine character sheets to six explicit views'
          git push
