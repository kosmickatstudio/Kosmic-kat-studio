name: Fix Kosmic Engine required-asset QA

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix aggregate QA to include missing assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kosmicengine.js')
          s=p.read_text(encoding='utf-8')
          old='const list=(items||[]).filter(x=>x&&x.url);'
          new='const list=(items||[]).filter(Boolean);'
          if old not in s:
              raise SystemExit('expected aggregate QA line missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check kosmicengine.js
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/_qa_required_assets_fix.yml
          git config user.name "kosmickatstudio"
          git config user.email "kosmic735@gmail.com"
          git add kosmicengine.js .github/workflows
          git commit -m "fix: require every asset in Engine QA aggregation"
          git push
