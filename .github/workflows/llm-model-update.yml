name: Update Free LLM Catalog

on:
  push:
    paths:
      - '.github/workflows/llm-model-update.yml'

permissions:
  contents: write

jobs:
  update-llms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update current free LLMs
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('home.js')
          s = p.read_text(encoding='utf-8')

          marker = 'const DIRECTOR_BANNERS={'
          override = r'''// ── CURRENT FREE LLM OVERRIDES ──
// Verified against provider docs on 2026-09-08. Keep this list focused on
// models that are actually usable through a provider's free developer tier.
// Google Gemini 3.8 Flash and 3.1 Flash-Lite currently have a Free Tier;
// Groq exposes GPT-OSS and Qwen models on its Free Plan.
if(typeof BRAIN_SUBMODELS!=="undefined"){
  Object.assign(BRAIN_SUBMODELS,{
    gemini:[
      {id:"gemini-3.8-flash",label:"Gemini 3.8 Flash — FREE (latest, best)"},
      {id:"gemini-3.7-flash",label:"Gemini 3.7 Flash — FREE (fast)"},
      {id:"gemini-3.1-flash-lite",label:"Gemini 3.1 Flash-Lite — FREE (fastest/cheap)"}
    ],
    groq:[
      {id:"openai/gpt-oss-120b",label:"GPT-OSS 120B — FREE (best reasoning)"},
      {id:"openai/gpt-oss-20b",label:"GPT-OSS 20B — FREE (very fast)"},
      {id:"qwen/qwen3.8-27b",label:"Qwen 3.8 27B — FREE (reasoning/coding)"}
    ]
  });
}

'''
          if marker not in s:
              raise SystemExit('home.js marker not found')
          if 'CURRENT FREE LLM OVERRIDES' not in s:
              s = s.replace(marker, override + marker, 1)

          # Keep the visible provider labels current without changing the
          # provider architecture or paid-provider credentials.
          s = s.replace('OpenAI GPT-4o (Supports images)', 'OpenAI (API, paid models)')
          s = s.replace('DeepSeek V4 Flash (Ultra cheap, text only)', 'DeepSeek (API, low-cost models)')
          s = s.replace('Groq GPT-OSS 120B (Free & fast, text only)', 'Groq — Free LLMs (GPT-OSS / Qwen)')
          s = s.replace('Google Gemini (Vision-capable, cheap, supports images)', 'Google Gemini — Free Tier models')

          p.write_text(s, encoding='utf-8')

      - name: Commit model update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home.js
          git diff --cached --quiet && echo 'No changes needed' || git commit -m 'chore: update free LLM models'
          git push

      - name: Remove temporary updater
        shell: bash
        run: |
          rm -f .github/workflows/llm-model-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/llm-model-update.yml
          git diff --cached --quiet && exit 0 || git commit -m 'chore: remove temporary LLM updater'
          git push
