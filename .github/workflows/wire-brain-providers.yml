name: One-time wire Grok and Kimi everywhere

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire Grok and Kimi across AI Brain surfaces
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  if new in s:
                      return False
                  raise SystemExit(f'Expected text not found in {path}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              return True

          replace_once('index.html',
              '''    {value:"deepseek",name:"DeepSeek V4 Flash",sub:"Ultra cheap, text only"},\n    {value:"aicredits",name:"AICredits Gateway",sub:"Routes to whichever model you pick below, images if that model supports them"},''',
              '''    {value:"deepseek",name:"DeepSeek V4 Flash",sub:"Ultra cheap, text only"},\n    {value:"grok",name:"Grok 4.6 (xAI)",sub:"xAI flagship, reasoning"},\n    {value:"kimi",name:"Kimi K3 (EvoLink)",sub:"Long-context reasoning"},\n    {value:"aicredits",name:"AICredits Gateway",sub:"Routes to whichever model you pick below, images if that model supports them"},''')

          old_map = 'const apiKeyMap={claude:"api_anthropic",gemini:"api_gemini",groq:"api_groq",deepseek:"api_deepseek",openai:"api_openai",aicredits:"api_aicredits"};'
          new_map = 'const apiKeyMap={claude:"api_anthropic",gemini:"api_gemini",groq:"api_groq",deepseek:"api_deepseek",openai:"api_openai",grok:"api_xai",kimi:"api_evolink",aicredits:"api_aicredits"};'
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          p.write_text(s.replace(old_map, new_map), encoding='utf-8')

          replace_once('index.html',
              'const modelNames={claude:"Claude (Anthropic)",gemini:"Google Gemini",groq:"Groq GPT-OSS 120B",deepseek:"DeepSeek V4 Flash",openai:"OpenAI GPT-4o",aicredits:"AICredits ("+(gs("aicredits_model","")||"no model set")+")"};',
              'const modelNames={claude:"Claude (Anthropic)",gemini:"Google Gemini",groq:"Groq GPT-OSS 120B",deepseek:"DeepSeek V4 Flash",openai:"OpenAI GPT-4o",grok:"Grok 4.6 (xAI)",kimi:"Kimi K3 (EvoLink)",aicredits:"AICredits ("+(gs("aicredits_model","")||"no model set")+")"};')
          replace_once('index.html',
              'const endpoints={groq:"https://api.groq.com/openai/v1/chat/completions",deepseek:"https://api.deepseek.com/v1/chat/completions",openai:"https://api.openai.com/v1/chat/completions",aicredits:"https://api.aicredits.in/v1/chat/completions"};',
              'const endpoints={groq:"https://api.groq.com/openai/v1/chat/completions",deepseek:"https://api.deepseek.com/v1/chat/completions",openai:"https://api.openai.com/v1/chat/completions",grok:"https://api.x.ai/v1/chat/completions",kimi:"https://direct.evolink.ai/v1/chat/completions",aicredits:"https://api.aicredits.in/v1/chat/completions"};')
          replace_once('index.html',
              'const modelIds={groq:getBrainModel("groq"),deepseek:getBrainModel("deepseek"),openai:getBrainModel("openai"),aicredits:gs("aicredits_model","")||"gpt-4o-mini"};',
              'const modelIds={groq:getBrainModel("groq"),deepseek:getBrainModel("deepseek"),openai:getBrainModel("openai"),grok:getBrainModel("grok")||"grok-4.6",kimi:getBrainModel("kimi")||"kimi-k3",aicredits:gs("aicredits_model","")||"gpt-4o-mini"};')
          replace_once('index.html',
              'body:JSON.stringify({model:modelIds[model],messages:[{role:"system",content:systemPrompt},{role:"user",content:userPrompt}],max_tokens:1200})',
              'body:JSON.stringify({model:modelIds[model],messages:[{role:"system",content:systemPrompt},{role:"user",content:userPrompt}],max_tokens:1200,...((model==="grok"||model==="kimi")?{reasoning_effort:"high"}: {})})')

          p = Path('home.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('var providerNames={claude:"Claude",gemini:"Gemini",openai:"OpenAI",groq:"Groq",deepseek:"DeepSeek"};',
                        'var providerNames={claude:"Claude",gemini:"Gemini",openai:"OpenAI",groq:"Groq",deepseek:"DeepSeek",grok:"Grok (xAI)",kimi:"Kimi K3 (EvoLink)"};')
          s = s.replace('const providerNames={claude:"Claude",gemini:"Gemini",openai:"OpenAI",groq:"Groq",deepseek:"DeepSeek"};',
                        'const providerNames={claude:"Claude",gemini:"Gemini",openai:"OpenAI",groq:"Groq",deepseek:"DeepSeek",grok:"Grok (xAI)",kimi:"Kimi K3 (EvoLink)"};')
          p.write_text(s, encoding='utf-8')

          replace_once('directors.js', old_map, new_map)
          replace_once('topicreel.js',
              'const hasBrain=["api_anthropic","api_gemini","api_groq","api_deepseek","api_openai","api_aicredits"].some(k=>gs(k));',
              'const hasBrain=["api_anthropic","api_gemini","api_groq","api_deepseek","api_openai","api_xai","api_evolink","api_aicredits"].some(k=>gs(k));')
          replace_once('topicreel.js',
              'an AI brain key (Anthropic/Gemini/Groq/DeepSeek/OpenAI/AICredits) for scriptwriting',
              'an AI brain key (Anthropic/Gemini/Groq/DeepSeek/OpenAI/xAI/EvoLink/AICredits) for scriptwriting')

          print('Brain provider wiring patch applied.')

      - name: Commit and push only if changes exist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git add index.html home.js directors.js topicreel.js
          git commit -m "fix: wire Grok and Kimi across AI brain"
          git push
