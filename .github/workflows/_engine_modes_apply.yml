name: Apply Kosmic Engine modes

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute prepared patch
        shell: bash
        run: python scripts/_apply-engine-modes.py
      - name: Syntax check
        shell: bash
        run: node --check kosmicengine.js
      - name: Remove temporary patch workflows and commit
        shell: bash
        run: |
          rm -f .github/workflows/_engine_modes_patch.yml .github/workflows/_engine_modes_apply.yml .github/workflows/_engine_patch_trigger.yml scripts/_apply-engine-modes.py
          git config user.name "kosmickatstudio"
          git config user.email "kosmic735@gmail.com"
          git add -A .github/workflows scripts/_apply-engine-modes.py kosmicengine.js
          git commit -m "feat: add Kosmic Engine Lite Advance Ultra tiers"
          git push
